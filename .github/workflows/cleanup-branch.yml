name: Cleanup branch

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

env:
  # The Worker every Preview belongs to, from apps/api/wrangler.jsonc.
  workerName: matchday-api

jobs:
  cleanup-preview:
    name: Delete preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs never created a branch or a Preview: their CI had no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Compute preview name
        id: meta
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Keep in sync with deploy-preview.yml: both must derive the same name.
          branch_slug=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          branch_slug="${branch_slug:0:24}"
          echo "preview_name=pr-${PR_NUMBER}-${branch_slug}" >> "$GITHUB_OUTPUT"

      # One Neon branch per PR, created by CI and removed here. A branch already gone (cleanup
      # re-run) fails the action, which is fine — the PR is closed either way.
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.pull_request.number }}

      # One API call, so no checkout, install or wrangler is needed.
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.meta.outputs.preview_name }}
        run: |
          status=$(curl -sS -o /tmp/cf-delete-response.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${workerName}/previews/${PREVIEW_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$status" = "404" ]; then
            echo "Preview ${PREVIEW_NAME} is already gone."
          elif [ "$status" = "200" ] || [ "$status" = "204" ]; then
            echo "Deleted preview ${PREVIEW_NAME}."
          else
            echo "::error::Could not delete preview ${PREVIEW_NAME} (HTTP ${status})."
            cat /tmp/cf-delete-response.json
            exit 1
          fi
